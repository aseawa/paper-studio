name: Bug report / 問題回報
description: Report a reproducible problem / 回報可重現的問題
body:
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour / 預期及實際行為
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 重現步驟
      description: Include an original or redistributable sample when relevant. / 如有需要，請附上原創或可再分發的範例。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and app version / 瀏覽器、作業系統及應用程式版本
    validations:
      required: true
